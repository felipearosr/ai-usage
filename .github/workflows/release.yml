name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_$(printf %s '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --target ${{ matrix.target }}

      # The archive holds a bare `aiu` at its root: the installer unpacks it
      # into a temporary directory and expects exactly that name.
      - name: Package
        run: |
          set -eu
          version=$(cargo metadata --format-version 1 --no-deps \
            | sed -n 's/.*"name":"aiu","version":"\([^"]*\)".*/\1/p')
          [ -n "$version" ] || { echo "could not read the crate version" >&2; exit 1; }
          echo "AIU_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          tar -czf "dist/aiu-$version-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" aiu

      - uses: actions/upload-artifact@v4
        with:
          name: aiu-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      # The tag is the source of truth for what is being published; a tag that
      # disagrees with Cargo.toml would produce artifact names the installer
      # cannot resolve from that tag's release.
      - name: Check the tag matches the crate version
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$tag" = "v$version" ] \
            || { echo "tag $tag does not match crate version $version" >&2; exit 1; }
          echo "AIU_VERSION=$version" >> "$GITHUB_ENV"

      # Checksums are what the installer verifies against, so they are
      # computed here over the exact bytes being uploaded.
      - name: Checksums and version marker
        working-directory: staging
        run: |
          set -eu
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$AIU_VERSION" > VERSION
          cat SHA256SUMS

      # Every artifact the installer can ask for must exist before the release
      # is published, or a user on that platform gets a 404 from a tag that
      # looks complete.
      - name: Verify the artifact matrix is complete
        working-directory: staging
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                        x86_64-apple-darwin aarch64-apple-darwin; do
            file="aiu-$AIU_VERSION-$target.tar.gz"
            [ -f "$file" ] || { echo "missing release artifact: $file" >&2; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" --title "$tag" --generate-notes \
            || gh release edit "$tag" --title "$tag"
          gh release upload "$tag" staging/* --clobber
