[package]
name = "aiu"
version = "0.1.0"
edition = "2021"
description = "AI coding subscription usage tracker (Claude Code, Codex, OpenCode Go)"
license = "MIT"

[[bin]]
name = "aiu"
path = "src/main.rs"

[dependencies]
# SQLite storage is mandated by the spec; bundled so we do not depend on a
# system libsqlite across Linux/macOS targets.
rusqlite = { version = "0.40", features = ["bundled"] }
# `--json` output on report commands is mandated by the spec.
serde_json = "1"
# Sync records have a stable, typed wire representation before encryption.
serde = { version = "1", features = ["derive"] }
# Audited AEAD primitive; XChaCha20's extended nonce is safe for random use.
chacha20poly1305 = "0.10"
# Opaque deterministic relay record IDs without exposing provider metadata.
sha2 = "0.10"
# Key relay record IDs so low-domain quota values cannot be dictionary-tested.
hmac = "0.12"
# Clear workspace key material when its owner is dropped.
zeroize = "1"
# Established ECDH + KDF primitives for authenticated ephemeral device pairing.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
# Small blocking HTTPS client for the opaque hosted relay protocol. Blocking
# I/O matches this short-lived CLI and avoids an async runtime.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
strip = true
lto = true
